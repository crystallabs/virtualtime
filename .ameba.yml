# Ameba configuration.
#
# TODO comments in the source are intentional development notes,
# so the admonition rule is disabled.
Documentation/DocumentationAdmonition:
  Enabled: false

# `alias Virtual` enumerates every value type a VirtualTime field accepts.
# Spelling `Nil` out alongside the others documents that better than a trailing
# `?` on a parenthesized union would.
Style/VerboseNilType:
  Enabled: false

# Fuzzers/oracles are throwaway-style verification harnesses, not library
# code; `lib` restores the default exclusion this key would otherwise replace
Excluded:
  - fuzz
  - lib
